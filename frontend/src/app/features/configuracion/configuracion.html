<div class="p-5 md:p-7">
  <h2 class="mb-4 text-lg font-bold">Configuración</h2>

  <div class="max-w-md rounded-2xl border border-border bg-surface p-4.5">
    <div class="mb-1 font-display text-sm font-semibold">Logo institucional</div>
    <p class="mb-4 text-[12.5px] text-text-muted">
      Se muestra en el mail de invitación a los alumnos y en el Portal del Alumno.
    </p>

    @if (cargando()) {
      <div class="mb-3.5 h-20 w-20 animate-pulse rounded-lg bg-border"></div>
    } @else {
      @if (negocio()?.logoUrl; as logoUrl) {
        <div class="mb-3.5 flex items-center gap-3.5">
          <img [src]="logoUrl" alt="Logo institucional" class="h-20 w-20 rounded-lg border border-border object-contain p-1" />
          <button
            type="button"
            (click)="eliminarLogo()"
            [disabled]="eliminando()"
            class="rounded-lg border border-border px-3.5 py-2 text-xs font-semibold text-debt-text transition-colors hover:bg-debt-bg disabled:opacity-60"
          >
            {{ eliminando() ? 'Quitando…' : 'Quitar logo' }}
          </button>
        </div>
      } @else {
        <div class="mb-3.5 rounded-2xl border border-dashed border-border p-4.5 text-center">
          <div class="mb-2.5 flex h-20 items-center justify-center rounded-lg border border-dashed border-border bg-page px-3 text-center text-[10.5px] text-text-muted">
            todavía no cargaste un logo
          </div>
        </div>
      }

      @if (error()) {
        <p class="mb-3 text-xs font-medium text-debt-text">{{ error() }}</p>
      }

      <button
        type="button"
        (click)="abrirSelectorArchivo()"
        [disabled]="subiendo()"
        class="rounded-lg bg-accent px-3.5 py-2 text-xs font-semibold text-white transition-colors hover:bg-accent-hover disabled:opacity-60"
      >
        {{ subiendo() ? 'Subiendo…' : (negocio()?.logoUrl ? 'Cambiar logo' : 'Subir logo') }}
      </button>
      <input
        #inputArchivo
        type="file"
        accept="image/png,image/jpeg,image/svg+xml,image/webp"
        class="hidden"
        (change)="onArchivoSeleccionado($event)"
      />
    }
  </div>
</div>
