<div
  class="relative flex min-h-screen items-center justify-center bg-page bg-cover bg-center px-4"
  style="background-image: url('/login-bg.jpg')"
>
  <div class="absolute inset-0 bg-black/55"></div>

  <form
    class="relative z-10 w-full max-w-sm rounded-xl border border-border bg-surface p-8 shadow-xl"
    (ngSubmit)="ingresar()"
  >

    <div class="mb-4 text-center font-display text-2xl font-bold text-accent">Gestor de Cobros</div>

    <p class="mb-6 text-center text-sm text-text-muted">Ingrese sus credenciales para continuar.</p>

    <label class="mb-1 block text-xs font-semibold text-text-muted">Email</label>
    <div class="mb-4">
      <div class="flex gap-2">
        <input
          type="text"
          name="emailLocal"
          autocomplete="username"
          placeholder="usuario"
          required
          class="min-w-0 flex-1 rounded-lg border border-border bg-page px-3 py-2 text-sm text-text outline-none focus:border-accent"
          [ngModel]="emailLocal()"
          (ngModelChange)="emailLocal.set($event)"
        />
        <select
          name="dominio"
          class="rounded-lg border border-border bg-page px-2 py-2 text-sm text-text outline-none focus:border-accent"
          [ngModel]="dominio()"
          (ngModelChange)="dominio.set($event)"
        >
          @for (d of dominios; track d.value) {
            <option [value]="d.value">{{ d.label }}</option>
          }
        </select>
      </div>

      @if (dominio() === 'otro') {
        <input
          type="text"
          name="dominioPersonalizado"
          placeholder="tudominio.com"
          required
          class="mt-2 w-full rounded-lg border border-border bg-page px-3 py-2 text-sm text-text outline-none focus:border-accent"
          [ngModel]="dominioPersonalizado()"
          (ngModelChange)="dominioPersonalizado.set($event)"
        />
      }
    </div>

    <label class="mb-1 block text-xs font-semibold text-text-muted">Contraseña</label>
    <input
      type="password"
      name="password"
      autocomplete="current-password"
      required
      class="mb-4 w-full rounded-lg border border-border bg-page px-3 py-2 text-sm text-text outline-none focus:border-accent"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
    />

    @if (error()) {
      <p class="mb-4 text-xs font-medium text-debt-text">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="cargando()"
      class="w-full rounded-lg bg-accent px-3 py-2 text-sm font-semibold text-white transition-colors hover:bg-accent-hover disabled:opacity-60"
    >
      {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</div>
