<div class="flex min-h-screen items-center justify-center bg-page px-4">
  <div class="w-full max-w-sm rounded-xl border border-border bg-surface p-8 shadow-sm">
    <div class="mb-6 font-display text-xl font-bold text-accent">Cobros</div>

    @if (completado()) {
      <p class="text-sm text-ok-text">
        Cuenta creada exitosamente. Te llevamos al login…
      </p>
    } @else {
      <form (ngSubmit)="confirmar()">
        <p class="mb-4 text-sm text-text-muted">Definí tu contraseña para activar tu cuenta.</p>

        @if (email(); as emailAlumno) {
          <label class="mb-1 block text-xs font-semibold text-text-muted">Email</label>
          <input
            type="email"
            [value]="emailAlumno"
            disabled
            class="mb-1 w-full cursor-not-allowed rounded-lg border border-border bg-page px-3 py-2 text-sm text-text-muted"
          />
          <p class="mb-4 text-xs text-text-muted">Vas a usar este correo para iniciar sesión.</p>
        }

        <label class="mb-1 block text-xs font-semibold text-text-muted">Contraseña</label>
        <input
          type="password"
          name="password"
          required
          class="mb-4 w-full rounded-lg border border-border bg-page px-3 py-2 text-sm text-text outline-none focus:border-accent"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />

        <label class="mb-1 block text-xs font-semibold text-text-muted">Repetir contraseña</label>
        <input
          type="password"
          name="confirmarPassword"
          required
          class="mb-4 w-full rounded-lg border border-border bg-page px-3 py-2 text-sm text-text outline-none focus:border-accent"
          [ngModel]="confirmarPassword()"
          (ngModelChange)="confirmarPassword.set($event)"
        />

        @if (error()) {
          <p class="mb-4 text-xs font-medium text-debt-text">{{ error() }}</p>
        }

        <button
          type="submit"
          [disabled]="cargando()"
          class="w-full rounded-lg bg-accent px-3 py-2 text-sm font-semibold text-white transition-colors hover:bg-accent-hover disabled:opacity-60"
        >
          {{ cargando() ? 'Confirmando…' : 'Activar cuenta' }}
        </button>

        <a routerLink="/login" class="mt-4 block text-center text-xs text-text-muted hover:underline">
          Volver al login
        </a>
      </form>
    }
  </div>
</div>
